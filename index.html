<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CouchDesk</title>
    <script>
      // Tema antes de pintar (sin destellos): src/data/themes.ts guarda aquí sus variables ya calculadas
      try {
        var s = JSON.parse(localStorage.getItem('couchdesk.theme.v1') || 'null'), r = document.documentElement
        if (s && s.vars) {
          for (var k in s.vars) r.style.setProperty(k, s.vars[k])
          r.dataset.theme = s.applied || 'salon'
          r.dataset.mode = s.vars['color-scheme'] || 'light'
        }
        // Movimiento: la app NO sigue el "sin animaciones" de Windows; solo el suyo (Ajustes → Rendimiento)
        var p = JSON.parse(localStorage.getItem('couchdesk.perf.v1') || 'null')
        if (p && p.reduceMotion === true) r.dataset.reduceMotion = ''
        // La primera pantalla espera debajo del arranque (BootSplash lo quita; por si acaso, a los 4 s)
        if (!/^\/(asistente-flotante|salvapantallas)/.test(location.pathname)) {
          r.dataset.booting = ''
          setTimeout(function () { delete r.dataset.booting }, 4000)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
