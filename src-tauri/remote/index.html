<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mando">
<link rel="manifest" href="/manifest.json?t=__TOKEN__">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Mando de CouchDesk</title>
<style>
  :root {
    --bg: #fbf8f2; --bg2: #f1ebe0; --surface: #fffdf9; --text: #1c1712; --muted: #8a7f72;
    --hair: rgba(58, 42, 24, .09); --green: #3f6440; --red: #93362f;
    --ease: cubic-bezier(.32, .72, 0, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
    --shell: inset 0 1px 1px #fff, 0 0 0 1px var(--hair), 0 0 0 4px rgba(255, 253, 249, .6), 0 0 0 5px rgba(58, 42, 24, .05), 0 14px 28px -16px rgba(80, 56, 30, .35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  body {
    color: var(--text);
    font: 15px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; touch-action: none; }

  /* Siempre en horizontal: si el móvil está de pie y no deja girar, giramos nosotros la página */
  #app {
    position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh;
    display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background: radial-gradient(50% 60% at 50% 0%, rgba(226, 196, 150, .25), transparent 70%), var(--bg);
  }
  #app.rot { width: 100vh; width: 100dvh; height: 100vw; transform-origin: 0 0; transform: translateX(100vw) rotate(90deg); }

  /* --- Fila de arriba y de abajo: un botón ancho en cada esquina, lo demás en el centro --- */
  /* El centro mide lo mismo arriba y abajo: así las cuatro esquinas son idénticas */
  .row { display: grid; grid-template-columns: minmax(0, 1fr) min(350px, 46%) minmax(0, 1fr); align-items: center; gap: 10px; }
  .row .center { justify-self: center; }
  .row > :first-child { justify-self: start; }
  .row > :last-child { justify-self: end; }
  .shoulder {
    width: min(100%, 250px); height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--surface); box-shadow: var(--shell); font-weight: 700; font-size: 15px; letter-spacing: .03em;
    transition: transform .3s var(--spring), background-color .25s var(--ease);
  }
  .shoulder small { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
  /* Botones superiores: redondeados arriba · gatillos: redondeados abajo (como en un mando) */
  .top .shoulder { border-radius: 22px 22px 12px 12px; }
  .bottom .shoulder { border-radius: 12px 12px 22px 22px; }
  .center { display: flex; align-items: center; gap: 10px; }
  .tabs-in { display: flex; gap: 4px; padding: 4px; border-radius: 99px; background: rgba(255, 253, 249, .7); box-shadow: inset 0 1px 1px #fff, 0 0 0 1px var(--hair); }
  .tabs-in button { height: 34px; padding: 0 16px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background-color .4s var(--ease), color .4s var(--ease); }
  .tabs-in button.on { background: var(--text); color: var(--bg); }
  #state { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  #state::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
  #state.on::before { background: var(--green); box-shadow: 0 0 0 4px rgba(63, 100, 64, .15); }
  /* Móviles estrechos: el estado es solo el punto de color y la pestaña se acorta */
  #app { container-type: inline-size; }
  @container (max-width: 760px) {
    #state { font-size: 0; gap: 0; }
    .tabs-in .long { display: none; }
    .tabs-in button { padding: 0 13px; }
    .shoulder small { font-size: 10px; }
  }
  .chip { height: 30px; padding: 0 12px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 1px 1px #fff, 0 0 0 1px var(--hair); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }

  main { position: relative; min-height: 0; container-type: size; }
  section { position: absolute; inset: 0; display: none; }
  section.on { display: grid; animation: in .45s var(--ease) both; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* --- Mando: zona izquierda · centro · zona derecha. Cada zona es una cuadrícula 2×2 --- */
  #gp { grid-template-columns: 1fr auto 1fr; align-items: stretch; }
  .zone { display: grid; grid-template: 1fr 1fr / 1fr 1fr; place-items: center; min-width: 0; }
  .mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 6px; }
  /* Xbox: stick izquierdo arriba-fuera, cruceta abajo-dentro · botones arriba-fuera, stick derecho abajo-dentro */
  #ls { grid-area: 1 / 1 / 3 / 2; align-self: start; }
  #dpad { grid-area: 2 / 2; }
  #abxy { grid-area: 1 / 2 / 3 / 3; align-self: start; }
  #rs { grid-area: 2 / 1; }
  /* PS5: cruceta y botones arriba-fuera, los dos sticks abajo hacia el centro */
  body.ps #dpad { grid-area: 1 / 1 / 3 / 2; align-self: start; }
  body.ps #ls { grid-area: 2 / 2; align-self: center; }

  .stick { --s: min(48cqh, 21cqw); position: relative; width: var(--s); height: var(--s); border-radius: 50%; }
  .stick .base {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, var(--surface), var(--bg2));
    box-shadow: inset 0 2px 6px rgba(58, 42, 24, .12), 0 0 0 1px var(--hair), 0 0 0 6px rgba(255, 253, 249, .6), 0 0 0 7px rgba(58, 42, 24, .05);
  }
  .stick .knob {
    position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, #3b322a, var(--text));
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .25), 0 10px 18px -6px rgba(28, 23, 18, .55);
    transition: transform .45s var(--spring);
  }
  .stick.held .knob { transition: none; }

  .cross, .face { --s: min(42cqh, 17cqw); width: var(--s); height: var(--s); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 5px; }
  .cross button, .face button {
    background: var(--surface); box-shadow: var(--shell); font-weight: 700; font-size: 17px;
    transition: transform .3s var(--spring), background-color .25s var(--ease);
  }
  .cross button { border-radius: 12px; }
  .face button { border-radius: 50%; font-size: 19px; }
  .face [data-k=enter] { color: #3f6440; } .face [data-k=esc] { color: #93362f; }
  .face [data-k=space] { color: #2e5f80; } .face [data-k=tab] { color: #8a6418; }
  body.ps .face [data-k=enter] { color: #3b5fa8; } body.ps .face [data-k=esc] { color: #b13a3a; }
  body.ps .face [data-k=space] { color: #b0558f; } body.ps .face [data-k=tab] { color: #2f8a76; }
  body.ps .face button { font-size: 23px; font-weight: 400; }
  .u { grid-area: 1/2; } .l { grid-area: 2/1; } .r { grid-area: 2/3; } .d { grid-area: 3/2; }
  .pressed { transform: scale(.9) !important; background: var(--bg2) !important; }

  #home {
    width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); box-shadow: var(--shell); transition: transform .3s var(--spring);
  }
  #home span { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--text); display: grid; place-items: center; }
  #home span::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
  .mid small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  /* --- Touchpad y teclado en la misma pantalla --- */
  #mouse { grid-template-columns: 1fr minmax(120px, 22%); gap: 10px; }
  .padcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
  #pad {
    flex: 1; border-radius: 22px; display: grid; place-items: center; text-align: center; padding: 16px;
    background: var(--surface); box-shadow: var(--shell); color: var(--muted); font-size: 13px; line-height: 1.6;
  }
  .clicks { display: flex; flex-direction: column; gap: 10px; }
  .clicks button { flex: 1; border-radius: 20px; background: var(--surface); box-shadow: var(--shell); font-weight: 600; transition: transform .3s var(--spring); }
  .clicks .kbtn { background: var(--text); color: var(--bg); }
  .typebar { display: none; gap: 6px; align-items: center; }
  .typebar.on { display: flex; animation: in .35s var(--ease) both; }
  #kbd {
    flex: 1; min-width: 0; height: 42px; padding: 0 18px; border: 0; outline: none; border-radius: 99px; font: inherit; font-size: 16px;
    background: var(--surface); box-shadow: inset 0 1px 2px rgba(58, 42, 24, .08), 0 0 0 1px var(--hair); user-select: text; -webkit-user-select: text;
  }
  .typebar button { height: 42px; padding: 0 12px; border-radius: 14px; background: var(--surface); box-shadow: var(--shell); font-size: 13px; font-weight: 600; }
  .typebar #kbdClose { background: none; box-shadow: none; color: var(--muted); font-weight: 500; }
  /* La consola pide escribir: el botón de teclado late hasta que lo tocas */
  .kbtn.ask { animation: ask 1.1s var(--ease) infinite; }
  @keyframes ask { 50% { box-shadow: 0 0 0 6px rgba(28, 23, 18, .15); transform: scale(1.03); } }

  /* --- Pantalla de inicio --- */
  #start {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(50% 50% at 50% 45%, rgba(226, 196, 150, .3), transparent 70%), var(--bg);
    transition: opacity .7s var(--ease), transform .7s var(--ease);
  }
  #start.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
  .mark { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--text); display: grid; place-items: center; animation: pop .9s var(--spring) both; }
  .mark::after { content: ''; width: 22px; height: 22px; border-radius: 50%; background: var(--text); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
  #start h1 { font: 400 34px/1 Georgia, "Times New Roman", serif; letter-spacing: -.02em; }
  #start p { color: var(--muted); font-size: 13px; max-width: 280px; text-align: center; }
  #name {
    width: 240px; height: 46px; padding: 0 18px; border: 0; outline: none; border-radius: 99px; text-align: center; font: inherit;
    background: var(--surface); box-shadow: inset 0 1px 2px rgba(58, 42, 24, .08), 0 0 0 1px var(--hair); user-select: text; -webkit-user-select: text;
  }
  #go {
    display: inline-flex; align-items: center; gap: 14px; height: 52px; padding: 0 8px 0 26px; border-radius: 99px;
    background: var(--text); color: var(--bg); font-weight: 600; box-shadow: 0 20px 40px -18px rgba(28, 23, 18, .6);
  }
  #go i { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .14); font-style: normal; }
</style>
</head>
<body>
<div id="app">
  <div class="row top">
    <button class="shoulder" data-k="voldown">LB <small data-i18n="volDown">Volumen −</small></button>
    <div class="center">
      <div class="tabs-in">
        <button data-tab="gp" class="on" data-i18n="pad">Mando</button>
        <button data-tab="mouse"><span data-i18n="touchpad">Touchpad</span><span class="long" data-i18n="andKeyboard"> y teclado</span></button>
      </div>
      <span id="state" data-i18n="connecting">Conectando</span>
    </div>
    <button class="shoulder" data-k="volup">RB <small data-i18n="volUp">Volumen +</small></button>
  </div>

  <main>
    <section id="gp" class="on">
      <div class="zone">
        <div class="stick" id="ls"><span class="base"></span><span class="knob"></span></div>
        <div class="cross" id="dpad">
          <button class="u" data-k="up">▲</button>
          <button class="l" data-k="left">◀</button>
          <button class="r" data-k="right">▶</button>
          <button class="d" data-k="down">▼</button>
        </div>
      </div>
      <div class="mid">
        <button id="home" data-k="home" aria-label="Ir al inicio" data-i18n-aria="homeAria"><span></span></button>
        <small data-i18n="home">Inicio</small>
      </div>
      <div class="zone">
        <div class="face" id="abxy">
          <button class="u" data-k="tab" data-x="Y" data-p="△">Y</button>
          <button class="l" data-k="space" data-x="X" data-p="□">X</button>
          <button class="r" data-k="esc" data-x="B" data-p="○">B</button>
          <button class="d" data-k="enter" data-x="A" data-p="✕">A</button>
        </div>
        <div class="stick" id="rs"><span class="base"></span><span class="knob"></span></div>
      </div>
    </section>

    <!-- Touchpad y teclado juntos: se mueve el puntero, se hace clic y se escribe sin cambiar de pantalla -->
    <section id="mouse">
      <div class="padcol">
        <div class="typebar" id="typebar">
          <input id="kbd" placeholder="Escribe: aparece en el PC al momento" data-i18n-ph="kbdPh" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
          <button data-k="backspace">⌫</button>
          <button data-k="enter" data-i18n="enter">Intro</button>
          <button data-k="tab">Tab</button>
          <button id="kbdClose" data-i18n="close">Cerrar</button>
        </div>
        <div id="pad"><span><span data-i18n="pad1">Desliza para mover · toca para hacer clic</span><br><span data-i18n="pad2">Dos dedos: desplazar · toque con dos dedos: clic derecho</span></span></div>
      </div>
      <div class="clicks">
        <button data-k="click" data-i18n="click">Clic</button>
        <button data-k="click-right" data-i18n="rightClick">Clic derecho</button>
        <button id="kbdOpen" class="kbtn">⌨ <span data-i18n="keyboard">Teclado</span></button>
      </div>
    </section>
  </main>

  <div class="row bottom">
    <button class="shoulder" data-k="click-right">LT <small data-i18n="rightClick">Clic derecho</small></button>
    <div class="center">
      <button class="chip" id="style"><span data-i18n="style">Estilo</span> <b>Xbox</b></button>
      <button class="chip" id="fs" data-i18n="fullscreen">Pantalla completa</button>
    </div>
    <button class="shoulder" data-k="click">RT <small data-i18n="click">Clic</small></button>
  </div>
</div>

<div id="start">
  <span class="mark"></span>
  <h1 data-i18n="pad">Mando</h1>
  <input id="name" maxlength="20" placeholder="Tu nombre" data-i18n-ph="name" autocomplete="off">
  <button id="go"><span data-i18n="start">Empezar</span> <i>→</i></button>
  <p data-i18n="startNote">Se pondrá a pantalla completa y en horizontal.</p>
</div>

<script>
(() => {
  // ---------- Idioma: el del móvil (es, en, pt-BR, fr, de, it; otro → inglés) ----------
  const DICT = {
    es: { title: 'Mando de CouchDesk', pad: 'Mando', volDown: 'Volumen −', volUp: 'Volumen +', touchpad: 'Touchpad', andKeyboard: ' y teclado',
      connecting: 'Conectando', connected: 'Conectado', reconnecting: 'Reconectando', homeAria: 'Ir al inicio', home: 'Inicio',
      kbdPh: 'Escribe: aparece en el PC al momento', enter: 'Intro', close: 'Cerrar', pad1: 'Desliza para mover · toca para hacer clic',
      pad2: 'Dos dedos: desplazar · toque con dos dedos: clic derecho', click: 'Clic', rightClick: 'Clic derecho', keyboard: 'Teclado',
      style: 'Estilo', fullscreen: 'Pantalla completa', name: 'Tu nombre', start: 'Empezar', startNote: 'Se pondrá a pantalla completa y en horizontal.', phone: 'Móvil' },
    en: { title: 'CouchDesk Controller', pad: 'Controller', volDown: 'Volume −', volUp: 'Volume +', touchpad: 'Touchpad', andKeyboard: ' & keyboard',
      connecting: 'Connecting', connected: 'Connected', reconnecting: 'Reconnecting', homeAria: 'Go to Home', home: 'Home',
      kbdPh: 'Type: it shows up on the PC right away', enter: 'Enter', close: 'Close', pad1: 'Swipe to move · tap to click',
      pad2: 'Two fingers: scroll · two-finger tap: right-click', click: 'Click', rightClick: 'Right-click', keyboard: 'Keyboard',
      style: 'Style', fullscreen: 'Full screen', name: 'Your name', start: 'Start', startNote: "It'll go full screen and landscape.", phone: 'Phone' },
    pt: { title: 'Controle do CouchDesk', pad: 'Controle', volDown: 'Volume −', volUp: 'Volume +', touchpad: 'Touchpad', andKeyboard: ' e teclado',
      connecting: 'Conectando', connected: 'Conectado', reconnecting: 'Reconectando', homeAria: 'Ir para o início', home: 'Início',
      kbdPh: 'Digite: aparece no PC na hora', enter: 'Enter', close: 'Fechar', pad1: 'Deslize para mover · toque para clicar',
      pad2: 'Dois dedos: rolar · toque com dois dedos: clique direito', click: 'Clique', rightClick: 'Clique direito', keyboard: 'Teclado',
      style: 'Estilo', fullscreen: 'Tela cheia', name: 'Seu nome', start: 'Começar', startNote: 'Vai ficar em tela cheia e na horizontal.', phone: 'Celular' },
    fr: { title: 'Manette CouchDesk', pad: 'Manette', volDown: 'Volume −', volUp: 'Volume +', touchpad: 'Pavé tactile', andKeyboard: ' et clavier',
      connecting: 'Connexion', connected: 'Connecté', reconnecting: 'Reconnexion', homeAria: "Aller à l'accueil", home: 'Accueil',
      kbdPh: "Écris : ça s'affiche tout de suite sur le PC", enter: 'Entrée', close: 'Fermer', pad1: 'Glisse pour déplacer · touche pour cliquer',
      pad2: 'Deux doigts : défiler · appui à deux doigts : clic droit', click: 'Clic', rightClick: 'Clic droit', keyboard: 'Clavier',
      style: 'Style', fullscreen: 'Plein écran', name: 'Ton nom', start: 'Commencer', startNote: "Ça passera en plein écran et à l'horizontale.", phone: 'Téléphone' },
    de: { title: 'CouchDesk-Controller', pad: 'Controller', volDown: 'Lautstärke −', volUp: 'Lautstärke +', touchpad: 'Touchpad', andKeyboard: ' und Tastatur',
      connecting: 'Verbinde', connected: 'Verbunden', reconnecting: 'Verbinde neu', homeAria: 'Zum Start', home: 'Start',
      kbdPh: 'Tippe: Es erscheint sofort auf dem PC', enter: 'Enter', close: 'Schließen', pad1: 'Wischen zum Bewegen · Tippen zum Klicken',
      pad2: 'Zwei Finger: scrollen · mit zwei Fingern tippen: Rechtsklick', click: 'Klick', rightClick: 'Rechtsklick', keyboard: 'Tastatur',
      style: 'Stil', fullscreen: 'Vollbild', name: 'Dein Name', start: "Los geht's", startNote: 'Es wechselt zu Vollbild und Querformat.', phone: 'Handy' },
    it: { title: 'Controller CouchDesk', pad: 'Controller', volDown: 'Volume −', volUp: 'Volume +', touchpad: 'Touchpad', andKeyboard: ' e tastiera',
      connecting: 'Connessione', connected: 'Connesso', reconnecting: 'Riconnessione', homeAria: 'Vai alla home', home: 'Home',
      kbdPh: 'Scrivi: appare subito sul PC', enter: 'Invio', close: 'Chiudi', pad1: 'Scorri per muovere · tocca per fare clic',
      pad2: 'Due dita: scorri · tocco con due dita: clic destro', click: 'Clic', rightClick: 'Clic destro', keyboard: 'Tastiera',
      style: 'Stile', fullscreen: 'Schermo intero', name: 'Il tuo nome', start: 'Inizia', startNote: 'Andrà a schermo intero e in orizzontale.', phone: 'Telefono' },
  };
  const langTag = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
  const lang = Object.keys(DICT).find((c) => langTag.startsWith(c)) || 'en';
  const T = DICT[lang];
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
  document.title = T.title;
  document.querySelector('meta[name=apple-mobile-web-app-title]').content = T.pad;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = T[el.dataset.i18nPh]; });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', T[el.dataset.i18nAria]));

  const token = new URLSearchParams(location.search).get('t');
  const $ = (s) => document.querySelector(s);
  const app = $('#app'), state = $('#state'), nameInput = $('#name'), kbd = $('#kbd');
  let ws = null;

  // ---------- Sin zoom, sin gestos del navegador ----------
  ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu'].forEach((e) => document.addEventListener(e, (ev) => ev.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', (e) => { if (!e.target.closest('input')) e.preventDefault() }, { passive: false });
  const buzz = (ms = 8) => navigator.vibrate && navigator.vibrate(ms);

  // ---------- Horizontal y pantalla completa ----------
  let rotated = false;
  let typing = false; // teclado del móvil abierto: la pantalla "encoge", no se recoloca nada
  const layout = () => {
    if (typing) return;
    rotated = innerHeight > innerWidth; // si el sistema no gira, giramos nosotros
    app.classList.toggle('rot', rotated);
  };
  // Con la página girada, el "derecha" del dedo en pantalla es el "abajo" del mando
  const local = (dx, dy) => (rotated ? [dy, -dx] : [dx, dy]);
  async function immersive() {
    const el = document.documentElement;
    try { if (!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' }); } catch {}
    try { if (el.webkitRequestFullscreen && !document.webkitFullscreenElement) el.webkitRequestFullscreen(); } catch {}
    try { await screen.orientation.lock('landscape'); } catch {}
    setTimeout(layout, 300);
  }
  addEventListener('resize', layout);
  addEventListener('orientationchange', () => setTimeout(layout, 250));

  // ---------- Pestañas (también las cambia la consola sola) ----------
  function showTab(tab) {
    document.querySelectorAll('.tabs-in button').forEach((x) => x.classList.toggle('on', x.dataset.tab === tab));
    document.querySelectorAll('section').forEach((s) => s.classList.toggle('on', s.id === tab));
    if (tab !== 'mouse') closeKeyboard();
  }
  document.querySelectorAll('.tabs-in button').forEach((b) => b.addEventListener('click', () => { buzz(6); showTab(b.dataset.tab); }));

  // ---------- Teclado sobre el touchpad ----------
  const typebar = $('#typebar'), kbtn = $('#kbdOpen');
  $('#pad').addEventListener('touchstart', (e) => { if (typing) e.preventDefault() }, { passive: false });
  function openKeyboard() {
    typing = true;
    kbtn.classList.remove('ask');
    typebar.classList.add('on');
    kbd.focus(); // dentro del toque: así el móvil saca su teclado
  }
  function closeKeyboard() {
    kbtn.classList.remove('ask');
    if (!typing) return;
    typing = false;
    typebar.classList.remove('on');
    kbd.blur();
    setTimeout(layout, 250);
  }
  kbtn.addEventListener('click', () => { buzz(8); typing ? closeKeyboard() : openKeyboard(); });
  $('#kbdClose').addEventListener('click', closeKeyboard);

  // ---------- Conexión ----------
  try { nameInput.value = localStorage.getItem('mando-nombre') || '' } catch {}
  const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
  const hello = () => send({ t: 'hello', name: nameInput.value.trim() || T.phone });
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token)}`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { state.textContent = T.connected; state.classList.add('on'); hello(); };
    ws.onclose = () => { state.textContent = T.reconnecting; state.classList.remove('on'); setTimeout(connect, 1000); };
    // Órdenes de la consola: qué pantalla enseñar y si hace falta escribir
    ws.onmessage = (e) => {
      if (typeof e.data !== 'string') return;
      let m; try { m = JSON.parse(e.data) } catch { return }
      if (m.t !== 'mode') return;
      if (m.tab) showTab(m.tab);
      if (m.kbd) {
        showTab('mouse');
        openKeyboard();
        // Algunos móviles solo sacan el teclado tras un toque: el botón late para pedirlo
        if (document.activeElement !== kbd) { typing = false; typebar.classList.remove('on'); kbtn.classList.add('ask'); buzz(20); }
      } else if (m.kbd === false) closeKeyboard();
    };
  }
  connect();

  $('#go').addEventListener('click', () => {
    try { localStorage.setItem('mando-nombre', nameInput.value) } catch {}
    hello(); buzz(12);
    $('#start').classList.add('gone');
    nameInput.blur();
    immersive();
  });
  $('#fs').addEventListener('click', immersive);

  // ---------- Estilo Xbox o PlayStation (se recuerda) ----------
  let ps = false;
  try { ps = localStorage.getItem('mando-estilo') === 'ps' } catch {}
  const applyStyle = () => {
    document.body.classList.toggle('ps', ps);
    $('#style b').textContent = ps ? 'PS5' : 'Xbox';
    document.querySelectorAll('#abxy button').forEach((b) => { b.textContent = ps ? b.dataset.p : b.dataset.x; });
  };
  $('#style').addEventListener('click', () => {
    ps = !ps;
    try { localStorage.setItem('mando-estilo', ps ? 'ps' : 'xbox') } catch {}
    buzz(10);
    applyStyle();
  });

  // ---------- Botones ----------
  const press = (el, k) => {
    el.classList.add('pressed'); buzz();
    if (k === 'click') send({ t: 'click', right: false });
    else if (k === 'click-right') send({ t: 'click', right: true });
    else send({ t: 'key', k });
  };
  document.querySelectorAll('[data-k]').forEach((b) => {
    let timer = 0, rep = 0;
    const repeatable = ['up', 'down', 'left', 'right', 'backspace', 'volup', 'voldown'].includes(b.dataset.k);
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault(); // también evita que se cierre el teclado al pulsar Intro o Borrar
      press(b, b.dataset.k);
      if (repeatable) timer = setTimeout(() => { rep = setInterval(() => send({ t: 'key', k: b.dataset.k }), 110) }, 380);
    });
    const up = () => { b.classList.remove('pressed'); clearTimeout(timer); clearInterval(rep); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  });

  // ---------- Movimiento del puntero (binario, 4 bytes) ----------
  let accX = 0, accY = 0, raf = 0;
  const flush = () => {
    raf = 0;
    const dx = Math.max(-32767, Math.min(32767, Math.round(accX)));
    const dy = Math.max(-32767, Math.min(32767, Math.round(accY)));
    accX -= dx; accY -= dy;
    if ((dx || dy) && ws && ws.readyState === 1) {
      const buf = new ArrayBuffer(4), v = new DataView(buf);
      v.setInt16(0, dx, true); v.setInt16(2, dy, true);
      ws.send(buf);
    }
  };
  const queueMove = (dx, dy) => { accX += dx; accY += dy; if (!raf) raf = requestAnimationFrame(flush); };

  // ---------- Sticks ----------
  function stick(el, onVector) {
    const knob = el.querySelector('.knob');
    let id = null, vx = 0, vy = 0;
    const update = (e) => {
      const r = el.getBoundingClientRect();
      const [lx, ly] = local(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      const max = el.offsetWidth * 0.36;
      const len = Math.hypot(lx, ly) || 1;
      const k = Math.min(1, max / len);
      vx = (lx * k) / max; vy = (ly * k) / max;
      knob.style.transform = `translate(${vx * max}px, ${vy * max}px)`;
    };
    el.addEventListener('pointerdown', (e) => { id = e.pointerId; el.setPointerCapture(id); el.classList.add('held'); update(e); buzz(6); });
    el.addEventListener('pointermove', (e) => { if (e.pointerId === id) update(e); });
    const release = (e) => { if (e.pointerId !== id) return; id = null; vx = vy = 0; el.classList.remove('held'); knob.style.transform = ''; };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release);
    let last = performance.now();
    const loop = (t) => { const dt = Math.min(50, t - last); last = t; onVector(vx, vy, dt); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  // Stick izquierdo = flechas (moverse por la consola), con repetición al mantener
  let dir = null, since = 0, lastRep = 0;
  stick($('#ls'), (x, y) => {
    const mag = Math.hypot(x, y), now = performance.now();
    const d = mag < 0.5 ? null : Math.abs(x) > Math.abs(y) ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
    if (d !== dir) { dir = d; since = lastRep = now; if (d) { send({ t: 'key', k: d }); buzz(5); } return; }
    if (d && now - since > 380 && now - lastRep > 140 - mag * 40) { lastRep = now; send({ t: 'key', k: d }); }
  });
  // Stick derecho = puntero, más rápido cuanto más se empuja
  stick($('#rs'), (x, y, dt) => {
    const mag = Math.hypot(x, y);
    if (mag < 0.08) return;
    const speed = 0.35 + 2.4 * Math.pow(mag, 2); // píxeles por milisegundo
    queueMove((x / mag) * speed * dt * mag, (y / mag) * speed * dt * mag);
  });

  // ---------- Touchpad ----------
  const pad = $('#pad'), touches = new Map();
  let start = null, moved = 0, maxFingers = 0, scrollAcc = 0;
  pad.addEventListener('pointerdown', (e) => {
    pad.setPointerCapture(e.pointerId);
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 1) { start = performance.now(); moved = 0; maxFingers = 1; }
    maxFingers = Math.max(maxFingers, touches.size);
  });
  pad.addEventListener('pointermove', (e) => {
    const t = touches.get(e.pointerId); if (!t) return;
    const [dx, dy] = local(e.clientX - t.x, e.clientY - t.y);
    t.x = e.clientX; t.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (touches.size === 1) {
      const f = 2.2 * (1 + Math.min(Math.hypot(dx, dy) / 25, 1.5)); // aceleración suave
      queueMove(dx * f, dy * f);
    } else if (touches.size === 2) {
      scrollAcc += dy * 4;
      if (Math.abs(scrollAcc) >= 40) { send({ t: 'scroll', dy: Math.round(-scrollAcc) }); scrollAcc = 0; }
    }
  });
  const end = (e) => {
    touches.delete(e.pointerId);
    if (touches.size === 0 && start !== null) {
      if (performance.now() - start < 220 && moved < 10) { send({ t: 'click', right: maxFingers >= 2 }); buzz(); }
      start = null;
    }
  };
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);

  // ---------- Teclado: se envía lo que se va escribiendo ----------
  let last = '';
  kbd.addEventListener('input', () => {
    const now = kbd.value;
    if (now.startsWith(last)) send({ t: 'text', s: now.slice(last.length) });
    else for (let i = 0; i < last.length - now.length; i++) send({ t: 'key', k: 'backspace' });
    last = now;
    if (now.length > 200) { kbd.value = ''; last = ''; }
  });
  kbd.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { send({ t: 'key', k: 'enter' }); kbd.value = ''; last = ''; e.preventDefault(); }
    if (e.key === 'Backspace' && kbd.value === '') send({ t: 'key', k: 'backspace' });
  });

  applyStyle();
  layout();
})();
</script>
</body>
</html>
