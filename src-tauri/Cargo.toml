[package]
name = "consola"
version = "1.0.0"
description = "Escritorio tipo consola para Windows, manejable con mando"
authors = ["Pablo Nolasco"]
license = "MIT"
repository = "https://github.com/pablonolascoo/consola"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Versión final: optimizada al máximo (más rápida y más pequeña)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = ["protocol-asset"] }
tauri-plugin-log = "2"
# Nunca dos consolas a la vez: si se abre otra, se trae al frente la que ya está
tauri-plugin-single-instance = "2"
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_UI_Input_XboxController", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
png = "0.18"
trash = "5.4.0"
libunftp = { version = "0.25.0", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4.1"
unftp-core = "0.1.1"
async-trait = "0.1.92"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "blocking", "json"] }
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.20.2"
# Mandos de PS4 / PS5 leídos directamente, sin drivers (motor 100 % Rust de Windows)
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
